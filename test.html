<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Robotics Room — Zoomable Map with Randomized Tooltips</title>
<style>
  :root {
    --aspect-w: 7;
    --aspect-h: 8;

    /* dark theme */
    --panel: #0e1116;
    --room:  #1b1f2a;     /* not white */
    --stroke:#0a0d12;
    --accent:#9bb7ff;     /* connector arrow */
    --text:  #e6ebf4;
    --muted: #9aa8c2;

    /* darker items */
    --drawer:#1e8a4a;     /* green drawers */
    --table: #0d86b5;     /* blue tables */
    --files: #b72a2a;     /* red file cabinets */
  }

  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(1200px 800px at 50% 0%, #0d0f14, #07080c);
    color: var(--text);
    font: 14px/1.4 system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    overflow: hidden;
    --right-tab-width: 300px;
  }

  .wrap {
    width: calc(100% - var(--right-tab-width));
    height: 100%;
    position: relative; border-radius: 0; overflow: hidden;
    background: var(--panel); box-shadow: 0 20px 60px rgba(0,0,0,.45);
  }

  .right-tab {
    width: var(--right-tab-width);
    height: 100%;
    background: var(--panel);
    border-left: 1px solid rgba(255,255,255,.08);
    box-shadow: -2px 0 10px rgba(0,0,0,.2);
    overflow-y: auto;
    padding: 1rem;
    position: relative;
    --edit-form-height: 400px;
    --edit-form-bottom-offset: 32px;
    --edit-pane-total-height: var(--edit-form-height);
  }

  /* Resize handle for right pane (left edge) */
  .right-tab-resize {
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 6px;
    cursor: ew-resize;
    background: transparent;
    z-index: 200;
    transition: background 0.2s;
    pointer-events: auto;
    margin-left: -2px;
  }

  .right-tab-resize:hover {
    background: var(--accent);
  }

  .right-tab-resize.dragging {
    background: var(--accent);
  }

  .edit-form {
    position: absolute;
    bottom: var(--edit-form-bottom-offset);
    left: 0;
    right: 0;
    height: var(--edit-form-height);
    max-height: calc(100vh - var(--edit-form-bottom-offset));
    background: var(--panel);
    border-top: 1px solid rgba(255,255,255,.08);
    box-shadow: 0 -2px 10px rgba(0,0,0,.2);
    padding: 1rem;
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
    box-sizing: border-box;
    overflow-y: auto;
    overflow-x: hidden;
    z-index: 100;
  }

  .edit-form-resize-wrapper {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 4px;
    z-index: 102;
    pointer-events: none;
  }

  /* Resize handle for edit form (top edge) */
  .edit-form-resize {
    width: 100%;
    height: 100%;
    cursor: ns-resize;
    background: transparent;
    transition: background 0.2s;
    pointer-events: auto;
  }

  .edit-form-resize:hover {
    background: var(--accent);
  }

  .edit-form-resize.dragging {
    background: var(--accent);
  }

  .right-tab h2 {
    margin: 0 0 0.5rem 0;
    font-size: 1.2rem;
    color: var(--text);
    font-weight: 600;
  }

  #pane-inventory {
    max-height: calc(100vh - var(--edit-pane-total-height) - 4rem);
    overflow-y: auto;
    overflow-x: hidden;
  }

  .inventory-table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 1rem;
    font-size: 0.85rem;
  }

  .inventory-table th {
    background: rgba(0,0,0,.3);
    color: var(--muted);
    text-align: left;
    padding: 0.5rem;
    font-weight: 600;
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    border-bottom: 1px solid rgba(255,255,255,.1);
  }

  .inventory-table td {
    padding: 0.5rem;
    border-bottom: 1px solid rgba(255,255,255,.05);
    color: var(--text);
  }

  .inventory-table tbody tr {
    cursor: move;
    transition: background-color 0.2s;
  }

  .inventory-table tbody tr:hover {
    background: rgba(255,255,255,.05);
  }

  .inventory-table tbody tr.dragging {
    opacity: 0.5;
    background: rgba(155, 183, 255, 0.1);
  }

  .inventory-table tbody tr.drag-over {
    border-top: 2px solid var(--accent);
  }

  .inventory-table .qty-cell {
    width: 80px;
    padding: 0;
  }

  .inventory-table .name-cell {
    cursor: pointer;
  }

  .inventory-table .name-cell span {
    display: block;
    padding: 0.25rem;
    color: var(--text);
  }

  .inventory-table .name-cell:hover span {
    color: var(--accent);
  }

  .inventory-table tbody tr.selected {
    background: rgba(155, 183, 255, 0.1);
  }

  .inventory-table .qty-cell input {
    width: 40px;
    background: transparent;
    border: none;
    color: var(--text);
    font-size: inherit;
    padding: 0.25rem;
    outline: none;
  }

  /* Hide default number input spinners */
  .inventory-table .qty-cell input[type="number"]::-webkit-inner-spin-button,
  .inventory-table .qty-cell input[type="number"]::-webkit-outer-spin-button,
  .add-row input[type="number"]::-webkit-inner-spin-button,
  .add-row input[type="number"]::-webkit-outer-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }

  .inventory-table .qty-cell input[type="number"],
  .add-row input[type="number"] {
    -moz-appearance: textfield;
    appearance: textfield;
  }

  /* Custom spinner buttons for quantity inputs */
  .qty-input-wrapper {
    position: relative;
    display: inline-block;
    width: 100%;
  }

  .qty-spinner {
    position: absolute;
    left: 2px;
    top: 2px;
    display: flex;
    flex-direction: column;
    height: calc(100% - 4px);
    width: 18px;
    pointer-events: none;
  }

  .qty-spinner-btn {
    flex: 1;
    background: rgba(255,255,255,.08);
    border: none;
    color: var(--text);
    cursor: pointer;
    font-size: 10px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: all;
    transition: background 0.2s;
    min-height: 0;
    padding: 0;
  }

  .qty-spinner-btn:first-child {
    border-radius: 3px 3px 0 0;
    border-bottom: 1px solid rgba(255,255,255,.05);
  }

  .qty-spinner-btn:last-child {
    border-radius: 0 0 3px 3px;
  }

  .qty-spinner-btn:hover {
    background: rgba(155, 183, 255, 0.2);
  }

  .qty-spinner-btn:active {
    background: rgba(155, 183, 255, 0.3);
  }

  /* Add-row specific spinner styles */
  .add-row .qty-spinner {
    position: relative;
    left: 0;
    top: 0;
    height: auto;
    width: auto;
    flex-direction: column;
    gap: 0;
    pointer-events: all;
  }

  .add-row .qty-spinner-btn {
    width: 20px;
    height: 12px;
    border-radius: 2px;
    font-size: 10px;
    flex: none;
    padding: 0;
    margin: 0;
    background: var(--accent);
    color: var(--panel);
  }

  .add-row .qty-spinner-btn:first-child {
    border-radius: 2px 2px 0 0;
    border-bottom: 1px solid rgba(0,0,0,.2);
  }

  .add-row .qty-spinner-btn:last-child {
    border-radius: 0 0 2px 2px;
    border-bottom: none;
  }

  .add-row .qty-spinner-btn:hover {
    opacity: 0.9;
  }

  .add-row .qty-spinner-btn:active {
    opacity: 0.8;
  }

  .qty-cell .qty-input-wrapper {
    width: 100%;
  }

  .qty-cell input[type="number"] {
    padding-left: 25px;
  }

  .inventory-table .name-cell input:focus,
  .inventory-table .qty-cell input:focus {
    background: rgba(255,255,255,.08);
    border-radius: 4px;
  }

  .inventory-separator {
    border-top: 2px solid rgba(255,255,255,.15);
    margin-top: 0.5rem;
    padding-top: 0.5rem;
  }

  .add-row {
    display: flex;
    gap: 0.5rem;
    align-items: center;
    margin-top: 0.5rem;
    width: 100%;
    box-sizing: border-box;
    max-width: 100%;
  }

  .add-row input {
    flex: 1 1 0;
    min-width: 0;
    background: rgba(0,0,0,.3);
    border: 1px solid rgba(255,255,255,.1);
    color: var(--text);
    padding: 0.4rem 0.5rem;
    border-radius: 6px;
    font-size: 0.85rem;
    outline: none;
    box-sizing: border-box;
  }

  .add-row input:focus {
    border-color: var(--accent);
    background: rgba(0,0,0,.4);
  }

  .add-row input[name="qty"] {
    width: 70px;
    flex: none;
    padding-left: 0.5rem;
    padding-right: 0.5rem;
  }

  .add-row .qty-input-wrapper {
    width: 70px;
    flex: none;
    position: relative;
  }

  .add-row #add-item-btn {
    background: var(--accent);
    color: var(--panel);
    border: none;
    padding: 0.4rem 0.8rem;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 600;
    font-size: 0.9rem;
    transition: opacity 0.2s;
    flex-shrink: 0;
  }

  .add-row #add-item-btn:hover {
    opacity: 0.9;
  }

  .add-row #add-item-btn:active {
    opacity: 0.8;
  }

  .add-row .qty-spinner-btn {
    padding: 0;
    margin: 0;
  }

  .right-tab .inventory-list.empty {
    color: var(--muted);
    font-style: italic;
    margin-top: 1rem;
  }


  .edit-form-placeholder {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
    color: var(--muted);
    font-style: italic;
  }

  .edit-form.visible .edit-form-placeholder {
    display: none;
  }

  .edit-form:not(.visible) .edit-form-content {
    display: none;
  }

  .edit-form.visible .edit-form-content {
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
  }

  .edit-form h3 {
    margin: 0 0 0.5rem 0;
    font-size: 1rem;
    color: var(--text);
    font-weight: 600;
    flex-shrink: 0;
  }

  .edit-form input[type="text"],
  .edit-form input[type="number"],
  .edit-form textarea {
    background: rgba(0,0,0,.3);
    border: 1px solid rgba(255,255,255,.1);
    color: var(--text);
    padding: 0.5rem;
    border-radius: 6px;
    font-size: 0.85rem;
    outline: none;
    width: 100%;
    box-sizing: border-box;
    font-family: inherit;
  }

  .edit-form input[type="text"],
  .edit-form input[type="number"] {
    flex-shrink: 0;
  }

  .edit-form-image-container {
    width: 100%;
    aspect-ratio: 16 / 9;
    background: rgba(0,0,0,.3);
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 6px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    position: relative;
  }

  .edit-form-image-container img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  .edit-form-image-placeholder {
    color: var(--muted);
    font-style: italic;
    font-size: 0.85rem;
  }

  .edit-form textarea {
    resize: none;
    height: 120px;
    overflow-y: auto;
    flex-shrink: 0;
  }

  .edit-form-actions {
    display: flex;
    gap: 0.5rem;
    justify-content: flex-end;
    flex-shrink: 0;
  }

  .edit-form button {
    padding: 0.5rem 1rem;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 600;
    font-size: 0.85rem;
    transition: opacity 0.2s;
  }

  .edit-form button.save {
    background: var(--accent);
    color: var(--panel);
  }

  .edit-form button.cancel {
    background: rgba(255,255,255,.1);
    color: var(--text);
  }

  .edit-form button:hover {
    opacity: 0.9;
  }

  .edit-form button:active {
    opacity: 0.8;
  }

  /* Modal overlay */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(4px);
    z-index: 1000;
    display: none;
    align-items: center;
    justify-content: center;
  }

  .modal-overlay.visible {
    display: flex;
  }

  .modal {
    background: var(--panel);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 12px;
    padding: 1.5rem;
    width: 90%;
    max-width: 500px;
    box-shadow: 0 20px 60px rgba(0,0,0,.6);
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
  }

  .modal h3 {
    margin: 0 0 0.5rem 0;
    font-size: 1rem;
    color: var(--text);
    font-weight: 600;
  }

  .modal input[type="text"],
  .modal input[type="number"],
  .modal textarea {
    background: rgba(0,0,0,.3);
    border: 1px solid rgba(255,255,255,.1);
    color: var(--text);
    padding: 0.5rem;
    border-radius: 6px;
    font-size: 0.85rem;
    outline: none;
    width: 100%;
    box-sizing: border-box;
    font-family: inherit;
  }

  .modal input[type="text"]:focus,
  .modal input[type="number"]:focus,
  .modal textarea:focus {
    border-color: var(--accent);
    background: rgba(0,0,0,.4);
  }

  .modal textarea {
    resize: none;
    min-height: 60px;
  }

  .modal-actions {
    display: flex;
    gap: 0.5rem;
    justify-content: flex-end;
    margin-top: 0.5rem;
  }

  .modal button {
    padding: 0.5rem 1rem;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 600;
    font-size: 0.85rem;
    transition: opacity 0.2s;
  }

  .modal button.save {
    background: var(--accent);
    color: var(--panel);
  }

  .modal button.cancel {
    background: rgba(255,255,255,.1);
    color: var(--text);
  }

  .modal button:hover {
    opacity: 0.9;
  }

  .modal button:active {
    opacity: 0.8;
  }

  /* Add button */
  .add-item-button {
    background: var(--accent);
    color: var(--panel);
    border: none;
    padding: 0.5rem 1rem;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 600;
    font-size: 0.9rem;
    transition: opacity 0.2s;
    margin-top: 0.5rem;
    width: 100%;
  }

  .add-item-button:hover {
    opacity: 0.9;
  }

  .add-item-button:active {
    opacity: 0.8;
  }

  /* Read-only qty cell */
  .inventory-table .qty-cell.readonly {
    text-align: center;
    color: var(--text);
  }

  .box.selected {
    filter: brightness(1.15);
    stroke: var(--accent);
    stroke-width: 3;
  }

  .box.drag-over-box {
    filter: brightness(1.2);
    stroke: var(--accent);
    stroke-width: 3;
    stroke-dasharray: 8 4;
  }

  svg#map { width: 100%; height: 100%; display: block; touch-action: none; user-select: none; }
  svg#overlay { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  svg#overlay { display: none; }


  .room { fill: var(--room); stroke: #2c3344; stroke-width: 6; }

  .box {
    vector-effect: non-scaling-stroke;
    stroke: var(--stroke); stroke-width: 2; rx: 10; ry: 10; cursor: pointer;
  }
  .box:hover { filter: brightness(1.06); }

  .titlebar {
    position: absolute; inset: 12px 12px auto 12px;
    background: rgba(0,0,0,.35); border: 1px solid rgba(255,255,255,.08);
    color: var(--text); padding: .4rem .6rem; border-radius: 12px; font-size: 13px;
  }
  .kbd { background:#0008;border:1px solid #fff2;padding:0 .35rem;border-radius:6px;font-size:12px;margin:0 .15rem; }

  .tooltip {
    position: absolute; pointer-events: none; display: none;
    background: #0f1420; color: var(--text);
    border: 1px solid #2a3244; border-radius: 10px; padding: .55rem .7rem;
    box-shadow: 0 10px 30px rgba(0,0,0,.4); font-weight: 500;
    transform: translate(-50%, -50%);
    white-space: normal;           /* allow wrapping */
    max-width: 260px;
  }
  .tooltip .sub { display:block; font-size:12px; color:var(--muted); margin-top:4px; font-weight:400; }
</style>
</head>
<body>

<div class="wrap" id="wrap">
  <div class="titlebar">Zoom: <span class="kbd">wheel</span> · Pan: <span class="kbd">drag</span> · Hover for name · Click for details</div>

  <!-- Map -->
  <svg id="map" viewBox="0 0 1600 1800" aria-label="Room map">
    <g id="world">
      <!-- room outline -->
      <rect class="room" x="80" y="80" width="1440" height="1600" rx="18" ry="18"/>

      <!-- workbench (down) -->
      <rect class="box" x="140" y="300" width="150" height="170" fill="#e7ebf3"
            data-title="Workbench"/>

      <!-- file cabinets (down) -->
      <rect class="box" data-title="File Cabinet A"
            x="140" y="700" width="200" height="260" fill="var(--files)"/>
      <rect class="box" data-title="File Cabinet B"
            x="140" y="1000" width="200" height="260" fill="var(--files)"/>

      <!-- drawers (top) -->
      <g id="drawers-top" fill="var(--drawer)">
        <rect class="box" data-title="Drawer T1" x="200"  y="120" width="190" height="120"/>
        <rect class="box" data-title="Drawer T2" x="410"  y="120" width="190" height="120"/>
        <rect class="box" data-title="Drawer T3" x="620"  y="120" width="190" height="120"/>
        <rect class="box" data-title="Drawer T4" x="830"  y="120" width="190" height="120"/>
        <rect class="box" data-title="Drawer T5" x="1040" y="120" width="190" height="120"/>
        <rect class="box" data-title="Drawer T6" x="1250" y="120" width="190" height="120"/>
      </g>

      <!-- drawers (right) -->
      <g id="drawers-right" fill="var(--drawer)">
        <rect class="box" data-title="Drawer R1" x="1340" y="320" width="170" height="170"/>
        <rect class="box" data-title="Drawer R2" x="1340" y="520" width="170" height="170"/>
        <rect class="box" data-title="Drawer R3" x="1340" y="720" width="170" height="170"/>
        <rect class="box" data-title="Drawer R4" x="1340" y="920" width="170" height="170"/>
        <rect class="box" data-title="Drawer R5" x="1340" y="1120" width="170" height="170"/>
      </g>

      <!-- tables (left) -->
      <rect class="box" data-title="Table A" x="420" y="520" width="300" height="200" fill="var(--table)"/>
      <rect class="box" data-title="Table B" x="880" y="520" width="300" height="200" fill="var(--table)"/>
      <rect class="box" data-title="Table C" x="420" y="940" width="300" height="200" fill="var(--table)"/>
      <rect class="box" data-title="Table D" x="880" y="940" width="300" height="200" fill="var(--table)"/>
    </g>
  </svg>

  <!-- Arrow overlay -->
  <svg id="overlay" viewBox="0 0 1600 1800" preserveAspectRatio="none">
    <defs>
      <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
        <path d="M0,0 L8,3 L0,6 Z" fill="var(--accent)"></path>
      </marker>
    </defs>
    <path id="connector" d="M0,0 L0,0" stroke="var(--accent)" stroke-width="3"
          marker-end="url(#arrowhead)" fill="none" opacity="0"></path>
  </svg>

  <!-- Tooltip -->
  <div id="tooltip" class="tooltip" role="tooltip" aria-hidden="true">
    <span id="tip-title"></span>
  </div>
</div>

<div class="right-tab">
  <div class="right-tab-resize" id="right-tab-resize"></div>
  <h2 id="pane-title">Select an item</h2>
  <div id="pane-inventory">
    <div class="inventory-list empty">Click on any inventory box to view its contents.</div>
  </div>
  <div class="edit-form" id="edit-form">
    <div class="edit-form-resize-wrapper">
      <div class="edit-form-resize" id="edit-form-resize"></div>
    </div>
    <div class="edit-form-placeholder">Select Item to Edit It</div>
    <div class="edit-form-content">
      <h3>Edit Item</h3>
      <input type="text" id="edit-name" placeholder="Item name">
      <div class="edit-form-image-container">
        <img id="edit-image" src="" alt="Item image" style="display: none;">
        <div class="edit-form-image-placeholder">No image</div>
      </div>
      <input type="number" id="edit-qty" placeholder="Quantity" value="1" min="0">
      <textarea id="edit-description" placeholder="Description (optional)"></textarea>
      <div class="edit-form-actions">
        <button type="button" class="cancel" id="edit-cancel">Cancel</button>
        <button type="button" class="save" id="edit-save">Save</button>
      </div>
    </div>
  </div>
</div>

<!-- Add Item Modal -->
<div class="modal-overlay" id="add-modal-overlay">
  <div class="modal" id="add-modal">
    <h3>Add Item</h3>
    <input type="text" id="add-name" placeholder="Item name">
    <input type="number" id="add-qty" placeholder="Quantity" value="1" min="0">
    <textarea id="add-description" placeholder="Description (optional)"></textarea>
    <div class="modal-actions">
      <button type="button" class="cancel" id="add-cancel">Cancel</button>
      <button type="button" class="save" id="add-save">Add</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script>
(function(){
  const wrap = document.getElementById('wrap');
  const svg  = document.getElementById('map');

  function sample(arr, k) {
    const copy = [...arr];
    const out = [];
    while (k-- && copy.length) {
      const i = Math.floor(Math.random() * copy.length);
      out.push(copy.splice(i,1)[0]);
    }
    return out;
  }

  // Store inventory data for each box
  const inventoryData = new Map();
  let currentEditingBox = null;
  let currentEditingIndex = null;
  let currentAddingBox = null;
  let lastSelectedIndex = null; // Track last selected index for shift-click
  let draggedItemData = null; // Store item being dragged from right pane

  // Assign random "contents" to every box
  document.querySelectorAll('.box').forEach((el) => {
    const items = sample(pool, 4);
    // Create inventory array with random quantities
    const inventory = items.map(name => ({
      name: name.trim(),
      qty: Math.floor(Math.random() * 5) + 1,
      description: ''
    }));
    inventoryData.set(el, inventory);
    el.dataset.sub = items.join(", "); // Keep for backward compatibility
    if (!el.dataset.title) el.dataset.title = "Container";
  });

  // Make workbench/tool-specific flavor
  const workbench = document.querySelector('[data-title="Workbench"]');
  if (workbench) {
    const workbenchItems = sample([
      "ESD mat & wrist strap","hot air rework station","fine-tip soldering iron",
      "PCB vise & magnifier lamp","smoke absorber fan","bin of spare 0603 passives",
      "oscilloscope probes & logic analyzer","calipers & torque screwdriver"
    ], 4);
    const inventory = workbenchItems.map(name => ({
      name: name.trim(),
      qty: Math.floor(Math.random() * 5) + 1,

  // --- Zoom / Pan --------------------------------------------
  const zoom = d3.zoom()

      world.setAttribute('transform', e.transform);
      if (tip.style.display === 'block' && currentTarget) positionTooltip(currentTarget);

  d3.select(svg).call(zoom).on('dblclick.zoom', null);
  d3.select(svg).call(zoom.transform, d3.zoomIdentity.scale(1.03));

  // --- Hover tooltips (name only) ----------------------------
  let currentTarget = null;
  let selectedBox = null;
  let currentDragOverBox = null; // Track which box is currently being dragged over
  
  svg.querySelectorAll('.box').forEach(el => {
    el.addEventListener('mouseenter', () => {
      currentTarget = el;
      tipTitle.textContent = el.dataset.title || 'Item';
      tip.style.display = 'block';
      tip.setAttribute('aria-hidden', 'false');
      positionTooltip(el);
    });
    el.addEventListener('mousemove', () => { if (currentTarget === el) positionTooltip(el); });
    el.addEventListener('mouseleave', () => {
      if (currentTarget === el) {
        currentTarget = null;
        tip.style.display = 'none';
        tip.setAttribute('aria-hidden', 'true');
        connector.style.opacity = 0;
      }
    });
    
    // --- Click handler for right pane -------------------------
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      
      // Remove previous selection
      if (selectedBox) {
        selectedBox.classList.remove('selected');
      }
      
      // Unselect any currently editing item
      editForm.classList.remove('visible');
      const tbody = document.getElementById('inventory-tbody');
      if (tbody) {
        tbody.querySelectorAll('tr').forEach(r => r.classList.remove('selected'));
      }
      currentEditingBox = null;
      currentEditingIndex = null;
      lastSelectedIndex = null;
      
      // Close add modal if open
      addModalOverlay.classList.remove('visible');
      currentAddingBox = null;
      
      // Add selection to clicked box
      el.classList.add('selected');
      selectedBox = el;
      
      // Update right pane
      const title = el.dataset.title || 'Item';
      const inventory = inventoryData.get(el) || [];
      
      paneTitle.textContent = title;
      renderInventoryTable(inventory, el);
    });

    // --- Drag and drop handlers for moving items from right pane to boxes ----
    el.addEventListener('dragenter', (e) => {
      if (draggedItemData) {
        e.preventDefault();
        // Remove drag-over from previous box
        if (currentDragOverBox && currentDragOverBox !== el) {
          currentDragOverBox.classList.remove('drag-over-box');
        }
        currentDragOverBox = el;
        el.classList.add('drag-over-box');
      }
    });

    el.addEventListener('dragover', (e) => {
      if (draggedItemData) {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        // Remove drag-over from previous box
        if (currentDragOverBox && currentDragOverBox !== el) {
          currentDragOverBox.classList.remove('drag-over-box');
        }
        currentDragOverBox = el;
        el.classList.add('drag-over-box');
      }
    });

    el.addEventListener('dragleave', (e) => {
      if (draggedItemData) {
        // Use a timeout to check if we're actually leaving (not just moving to a child)
        setTimeout(() => {
          const rect = el.getBoundingClientRect();
          const x = e.clientX;
          const y = e.clientY;
          // Only remove if mouse is actually outside the box bounds
          if (x < rect.left || x > rect.right || y < rect.top || y > rect.bottom) {
            el.classList.remove('drag-over-box');
            if (currentDragOverBox === el) {
              currentDragOverBox = null;
            }
          }
        }, 0);
      }
    });

    el.addEventListener('drop', (e) => {
      if (draggedItemData && draggedItemData.sourceBox !== el) {
        e.preventDefault();
        e.stopPropagation();
        
        const sourceInventory = inventoryData.get(draggedItemData.sourceBox);
        
        if (draggedItemData.isMultiple && draggedItemData.items) {
          // Multiple items selected - move all of them
          // Remove items from source (in reverse order to maintain indices)
          const sortedIndices = [...draggedItemData.sourceIndices].sort((a, b) => b - a);
          sortedIndices.forEach(idx => {
            sourceInventory.splice(idx, 1);
          });
          saveInventory(draggedItemData.sourceBox);
          
          // Add all items to destination box
          let destInventory = inventoryData.get(el) || [];
          destInventory.push(...draggedItemData.items);
          inventoryData.set(el, destInventory);
          saveInventory(el);
        } else {
          // Single item drag (original behavior)
          const item = sourceInventory[draggedItemData.sourceIndex];
          
          // Remove from source box
          sourceInventory.splice(draggedItemData.sourceIndex, 1);
          saveInventory(draggedItemData.sourceBox);
          
          // Add to destination box
          let destInventory = inventoryData.get(el) || [];
          destInventory.push(item);
          inventoryData.set(el, destInventory);
          saveInventory(el);
        }
        
        // Update the right pane if either box is selected
        if (selectedBox === draggedItemData.sourceBox || selectedBox === el) {
          const title = selectedBox.dataset.title || 'Item';
          const inventory = inventoryData.get(selectedBox) || [];
          paneTitle.textContent = title;
          renderInventoryTable(inventory, selectedBox);
        }
        
        // Clear selections after successful move
        lastSelectedIndex = null;
        
        // Reset drag state
        draggedItemData = null;
        currentDragOverBox = null;
        el.classList.remove('drag-over-box');
        // Clear from all boxes
        svg.querySelectorAll('.box').forEach(box => box.classList.remove('drag-over-box'));
      }
    });
  });

  // --- Inventory Table Rendering ------------------------------
  function renderInventoryTable(inventory, boxElement) {
    if (!inventory || inventory.length === 0) {
      paneInventory.innerHTML = '<div class="inventory-list empty">No inventory listed.</div><button class="add-item-button" id="add-item-btn">Add Item</button>';
      setupAddButton(boxElement);
      return;
    }

    let html = '<table class="inventory-table">';
    html += '<thead><tr><th>Name</th><th class="qty-cell">Qty</th></tr></thead>';
    html += '<tbody id="inventory-tbody">';
    
    inventory.forEach((item, index) => {
      html += `<tr data-index="${index}" draggable="true">
        <td class="name-cell"><span>${escapeHtml(item.name)}</span></td>
        <td class="qty-cell readonly">${escapeHtml(String(item.qty))}</td>
      </tr>`;
    });
    
    html += '</tbody></table>';
    html += '<div class="inventory-separator"></div>';
    html += '<button class="add-item-button" id="add-item-btn">Add Item</button>';
    
    paneInventory.innerHTML = html;
    
    // Setup event listeners
    setupInventoryTable(boxElement);
    setupAddButton(boxElement);
  }

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  function setupInventoryTable(boxElement) {
    const tbody = document.getElementById('inventory-tbody');
    if (!tbody) return;

    // Click handlers for name cells to open edit form
    tbody.querySelectorAll('.name-cell').forEach(cell => {
      cell.addEventListener('click', (e) => {
        e.stopPropagation();
        const row = cell.closest('tr');
        const index = parseInt(row.dataset.index);
        const inventory = inventoryData.get(boxElement);
        
        if (inventory[index]) {
          if (e.shiftKey && lastSelectedIndex !== null) {
            // Shift-click: select range from last selected to current
            // Clear previous selections first
            tbody.querySelectorAll('tr').forEach(r => r.classList.remove('selected'));
            
            const start = Math.min(lastSelectedIndex, index);
            const end = Math.max(lastSelectedIndex, index);
            const rows = Array.from(tbody.querySelectorAll('tr'));
            
            // Select all rows in range
            for (let i = start; i <= end; i++) {
              if (rows[i]) {
                rows[i].classList.add('selected');
              }
            }
            
            // Update last selected index
            lastSelectedIndex = index;
            
            // Store editing context for the last clicked item
            currentEditingBox = boxElement;
            currentEditingIndex = index;
            
            // Populate edit form with the last clicked item
            editName.value = inventory[index].name || '';
            editQty.value = inventory[index].qty || 1;
            editDescription.value = inventory[index].description || '';
            const imageContainer = editImage.parentElement;
            const placeholder = imageContainer.querySelector('.edit-form-image-placeholder');
            if (inventory[index].image) {
              editImage.src = inventory[index].image;
              editImage.style.display = 'block';
              if (placeholder) placeholder.style.display = 'none';
            } else {
              editImage.src = '';
              editImage.style.display = 'none';
              if (placeholder) placeholder.style.display = 'block';
            }
            
            // Show edit form
            editForm.classList.add('visible');
            editName.focus();
          } else {
            // Normal click: single selection
            tbody.querySelectorAll('tr').forEach(r => r.classList.remove('selected'));
            row.classList.add('selected');
            
            // Store editing context
            currentEditingBox = boxElement;
            currentEditingIndex = index;
            lastSelectedIndex = index;
            
            // Populate edit form
            editName.value = inventory[index].name || '';
            editQty.value = inventory[index].qty || 1;
            editDescription.value = inventory[index].description || '';
            const imageContainer = editImage.parentElement;
            const placeholder = imageContainer.querySelector('.edit-form-image-placeholder');
            if (inventory[index].image) {
              editImage.src = inventory[index].image;
              editImage.style.display = 'block';
              if (placeholder) placeholder.style.display = 'none';
            } else {
              editImage.src = '';
              editImage.style.display = 'none';
              if (placeholder) placeholder.style.display = 'block';
            }
            
            // Show edit form
            editForm.classList.add('visible');
            editName.focus();
          }
        }
      });
    });

    // Drag and drop
    let draggedRow = null;
    let draggedIndex = null;

    tbody.querySelectorAll('tr').forEach((row, index) => {
      row.addEventListener('dragstart', (e) => {
        // Don't start drag if clicking on name cell (which opens edit form)
        if (e.target.closest('.name-cell')) {
          e.preventDefault();
          return;
        }
        
        // Check if multiple items are selected
        const selectedRows = tbody.querySelectorAll('tr.selected');
        const inventory = inventoryData.get(boxElement);
        
        if (selectedRows.length > 1) {
          // Multiple items selected - drag all of them
          const selectedIndices = Array.from(selectedRows).map(r => parseInt(r.dataset.index)).sort((a, b) => a - b);
          const selectedItems = selectedIndices.map(idx => ({ ...inventory[idx] }));
          
          draggedRow = row;
          draggedIndex = index;
          
          // Mark all selected rows as dragging
          selectedRows.forEach(r => r.classList.add('dragging'));
          e.dataTransfer.effectAllowed = 'move';
          e.dataTransfer.setData('text/html', row.innerHTML);
          
          // Store all selected items for cross-pane dragging
          draggedItemData = {
            sourceBox: boxElement,
            sourceIndices: selectedIndices,
            items: selectedItems,
            isMultiple: true
          };
        } else {
          // Single item drag
          draggedRow = row;
          draggedIndex = index;
          row.classList.add('dragging');
          e.dataTransfer.effectAllowed = 'move';
          e.dataTransfer.setData('text/html', row.innerHTML);
          
          // Store the item data for cross-pane dragging
          if (inventory[index]) {
            draggedItemData = {
              sourceBox: boxElement,
              sourceIndex: index,
              item: { ...inventory[index] },
              isMultiple: false
            };
          }
        }
      });

      row.addEventListener('dragend', (e) => {
        // Remove dragging class from all rows
        tbody.querySelectorAll('tr').forEach(r => r.classList.remove('dragging'));
        tbody.querySelectorAll('tr').forEach(r => r.classList.remove('drag-over'));
        
        // Clear drag-over-box from all boxes
        svg.querySelectorAll('.box').forEach(box => box.classList.remove('drag-over-box'));
        currentDragOverBox = null;
        
        // Reset dragged item data if drop didn't happen on a box
        if (draggedItemData && e.dataTransfer.dropEffect === 'none') {
          draggedItemData = null;
        }
      });

      row.addEventListener('dragover', (e) => {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        const afterElement = getDragAfterElement(tbody, e.clientY);
        tbody.querySelectorAll('tr').forEach(r => r.classList.remove('drag-over'));
        if (afterElement == null || afterElement === row) {
          row.classList.add('drag-over');
        }
      });

      row.addEventListener('drop', (e) => {
        e.preventDefault();
        if (draggedRow !== row) {
          // Clear cross-pane drag data since we're dropping within the table
          draggedItemData = null;
          
          const inventory = inventoryData.get(boxElement);
          const items = [...inventory];
          const draggedItem = items[draggedIndex];
          items.splice(draggedIndex, 1);
          
          // Calculate drop index - need to account for the fact that draggedRow is still in DOM
          const allRows = Array.from(tbody.children);
          let dropIndex = allRows.indexOf(row);
          
          // Adjust index if dragging forward
          if (draggedIndex < dropIndex) {
            dropIndex--;
          }
          
          items.splice(dropIndex, 0, draggedItem);
          
          inventoryData.set(boxElement, items);
          renderInventoryTable(items, boxElement);
        }
      });
    });

    // No more add-row handlers needed - using modal instead
  }

  function setupAddButton(boxElement) {
    const addBtn = document.getElementById('add-item-btn');
    if (!addBtn) return;

  function getDragAfterElement(container, y) {
    const draggableElements = [...container.querySelectorAll('tr:not(.dragging)')];
    
    return draggableElements.reduce((closest, child) => {
      const box = child.getBoundingClientRect();
      const offset = y - box.top - box.height / 2;
      
      if (offset < 0 && offset > closest.offset) {
        return { offset: offset, element: child };
      } else {
        return closest;
      }
    }, { offset: Number.NEGATIVE_INFINITY }).element;
  }

  // --- Resize handlers ----------------------------------------
  // Right tab resize (left/right)
  let isResizingRightTab = false;
  let startX = 0;
  let startWidth = 0;

  rightTabResize.addEventListener('mousedown', (e) => {
    isResizingRightTab = true;
    startX = e.clientX;
    startWidth = parseInt(getComputedStyle(rightTab).width);
    rightTabResize.classList.add('dragging');
    e.preventDefault();
  });

  document.addEventListener('mousemove', (e) => {
    if (isResizingRightTab) {
      const diff = startX - e.clientX; // Inverted because dragging left increases width
      const newWidth = Math.max(200, Math.min(800, startWidth + diff));
      document.body.style.setProperty('--right-tab-width', `${newWidth}px`);
      rightTab.style.setProperty('--right-tab-width', `${newWidth}px`);
    }
  });

  document.addEventListener('mouseup', () => {
    if (isResizingRightTab) {
      isResizingRightTab = false;
      rightTabResize.classList.remove('dragging');
    }
  });

  // Edit form resize (up/down)
  let isResizingEditForm = false;
  let startY = 0;
  let startHeight = 0;

  editFormResize.addEventListener('mousedown', (e) => {
    isResizingEditForm = true;
    startY = e.clientY;
    startHeight = parseInt(getComputedStyle(rightTab).getPropertyValue('--edit-form-height')) || 400;
    editFormResize.classList.add('dragging');
    e.preventDefault();
  });

  document.addEventListener('mousemove', (e) => {
    if (isResizingEditForm) {
      const diff = startY - e.clientY; // Inverted because dragging up increases height
      const newHeight = Math.max(250, Math.min(800, startHeight + diff));
      rightTab.style.setProperty('--edit-form-height', `${newHeight}px`);
    }
  });

  document.addEventListener('mouseup', () => {
    if (isResizingEditForm) {
      isResizingEditForm = false;
      editFormResize.classList.remove('dragging');

  });

  editName.addEventListener('keydown', (e) => {

    }

    if (e.key === 'Enter') {
      e.preventDefault();
      addSave.click();
    }
  });

  // --- Tooltip/connector positioning -------------------------
  function positionTooltip(target){
    const rectBox = target.getBoundingClientRect();
    const wrapBox = wrap.getBoundingClientRect();
    const cx = rectBox.left + rectBox.width/2 - wrapBox.left;
    const cy = rectBox.top  + rectBox.height/2 - wrapBox.top;

    const placeRight = cx < wrapBox.width * 0.55;
    tip.style.left = '0px'; tip.style.top = '0px';
    const tw = tip.offsetWidth;
    const pad = 14;

    const tipX = cx;
    const tipY = cy;

    tip.style.transform = `translate(${Math.round(tipX)}px, ${Math.round(tipY)}px)`;
    tip.style.display = 'block';

    const scaleX = 1600 / wrapBox.width;
    const scaleY = 1800 / wrapBox.height;
    const tipEdgeX = (tipX + (placeRight ? -tw/2 : tw/2));
    const tipEdgeY = tipY;

    connector.setAttribute('d', `M ${tipEdgeX*scaleX},${tipEdgeY*scaleY} L ${cx*scaleX},${cy*scaleY}`);
    connector.style.opacity = 1;
  }

  window.addEventListener('resize', () => { if (currentTarget) positionTooltip(currentTarget); });
})();
</script>
</body>
